<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Human API · 回复台</title>
<style>
  :root{
    --bg:#0f1115; --card:#181b22; --card2:#1f232c; --line:#2a2f3a;
    --fg:#e8eaed; --dim:#98a0ae; --accent:#4c8dff; --accent2:#2f6fe0;
    --ok:#37c871; --warn:#f5a524; --err:#f05252;
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);color:var(--fg);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    overscroll-behavior-y:contain;
  }
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  .hide{display:none !important}

  /* ---------- gate ---------- */
  #gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
  .gate-box{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
  .gate-box h1{margin:0 0 6px;font-size:19px}
  .gate-box p{margin:0 0 16px;color:var(--dim);font-size:13px}
  .gate-box input{width:100%;padding:12px;background:#0c0e12;border:1px solid var(--line);border-radius:10px;outline:none}
  .gate-box input:focus{border-color:var(--accent)}
  .gate-box button{margin-top:12px;width:100%;padding:12px;border-radius:10px;background:var(--accent);color:#fff;font-weight:600}
  .gate-err{margin-top:10px;color:var(--err);font-size:13px;min-height:18px}

  /* ---------- shell ---------- */
  #app{display:flex;flex-direction:column;height:100%}
  header{
    display:flex;align-items:center;gap:10px;padding:10px 14px;
    padding-top:calc(10px + env(safe-area-inset-top,0px));
    border-bottom:1px solid var(--line);background:#12141a;position:sticky;top:0;z-index:5
  }
  header .title{font-weight:700;font-size:15px}
  header .dot{width:8px;height:8px;border-radius:50%;background:var(--err)}
  header .dot.on{background:var(--ok)}
  header .spacer{flex:1}
  header .pill{font-size:12px;color:var(--dim);background:var(--card2);border-radius:999px;padding:3px 9px}
  main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 90px}
  .tabbar{
    display:flex;border-top:1px solid var(--line);background:#12141a;
    padding-bottom:var(--safe-b);position:fixed;bottom:0;left:0;right:0;z-index:6
  }
  .tabbar button{flex:1;padding:11px 0 13px;color:var(--dim);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
  .tabbar button.sel{color:var(--accent)}
  .tabbar .ic{font-size:17px;line-height:1}
  .badge{background:var(--err);color:#fff;border-radius:999px;font-size:10px;padding:1px 6px;margin-left:4px}

  /* ---------- cards ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
  .card.pending{border-left:3px solid var(--accent)}
  .card.expired{border-left:3px solid var(--warn)}
  .card h3{margin:0 0 4px;font-size:15px;font-weight:600;word-break:break-word}
  .meta{display:flex;flex-wrap:wrap;gap:8px;color:var(--dim);font-size:12px;margin-top:6px}
  .meta .tag{background:var(--card2);border-radius:6px;padding:1px 7px}
  .empty{text-align:center;color:var(--dim);padding:48px 20px;font-size:14px}
  .answered-text{white-space:pre-wrap;word-break:break-word;color:#cfe3ff;background:#141b26;border:1px solid #24354d;border-radius:10px;padding:10px;margin-top:8px;font-size:14px}
  .sec-title{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin:16px 4px 8px}

  /* ---------- sheet ---------- */
  #sheet{position:fixed;inset:0;background:#0f1115;z-index:20;display:flex;flex-direction:column}
  #sheet header{position:static}
  .sheet-body{flex:1;overflow-y:auto;padding:12px}
  .msg{margin-bottom:10px;display:flex}
  .msg .bubble{max-width:86%;border-radius:12px;padding:9px 12px;white-space:pre-wrap;word-break:break-word;font-size:14px}
  .msg.user{justify-content:flex-start}
  .msg.user .bubble{background:var(--card2);border:1px solid var(--line)}
  .msg.assistant{justify-content:flex-end}
  .msg.assistant .bubble{background:#1b3557;border:1px solid #27466f;color:#dce9ff}
  .msg.system .bubble,.msg.tool .bubble{background:#1a1d24;border:1px dashed var(--line);color:var(--dim);font-size:13px}
  .role{font-size:11px;color:var(--dim);margin:0 0 3px 2px}
  .composer{border-top:1px solid var(--line);background:#12141a;padding:10px 12px calc(10px + var(--safe-b))}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch}
  .chips button{white-space:nowrap;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--dim)}
  .composer textarea{width:100%;min-height:88px;max-height:40vh;resize:vertical;background:#0c0e12;border:1px solid var(--line);border-radius:10px;padding:10px;outline:none}
  .composer textarea:focus{border-color:var(--accent)}
  .row{display:flex;gap:8px;margin-top:8px;align-items:center}
  .btn{padding:11px 16px;border-radius:10px;background:var(--accent);color:#fff;font-weight:600}
  .btn:disabled{opacity:.5}
  .btn.ghost{background:var(--card2);color:var(--dim);font-weight:400}
  .btn.danger{background:#3a1d1d;color:#ff9d9d}
  .row .spacer{flex:1}
  .hint{color:var(--dim);font-size:12px}

  /* ---------- settings ---------- */
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;color:var(--dim);margin-bottom:6px}
  .field input,.field select{width:100%;padding:11px;background:#0c0e12;border:1px solid var(--line);border-radius:10px;outline:none}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .kv span:last-child{color:var(--dim);text-align:right;word-break:break-all}
  code{background:#0c0e12;border:1px solid var(--line);border-radius:6px;padding:1px 5px;font-size:12px}
  .toast{
    position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:99;
    background:#232936;border:1px solid var(--line);color:var(--fg);
    border-radius:10px;padding:10px 16px;font-size:13px;box-shadow:0 8px 24px #0008;max-width:88vw;text-align:center
  }
</style>
</head>
<body>

<div id="gate">
  <div class="gate-box">
    <h1>Human API · 回复台</h1>
    <p>输入 admin token 解锁。token 在服务启动日志里，或见 <code>data/config.json</code>。</p>
    <input id="tokenInput" type="password" placeholder="admin token" autocomplete="current-password">
    <button id="loginBtn">进入</button>
    <div class="gate-err" id="gateErr"></div>
  </div>
</div>

<div id="app" class="hide">
  <header>
    <span class="dot" id="connDot"></span>
    <span class="title">回复台</span>
    <span class="spacer"></span>
    <span class="pill" id="statPill">—</span>
  </header>

  <main>
    <section id="tab-queue"></section>
    <section id="tab-done" class="hide"></section>
    <section id="tab-settings" class="hide"></section>
  </main>

  <nav class="tabbar">
    <button data-tab="queue" class="sel"><span class="ic">📥</span><span>待回复<span class="badge hide" id="tabBadge">0</span></span></button>
    <button data-tab="done"><span class="ic">✅</span><span>已回复</span></button>
    <button data-tab="settings"><span class="ic">⚙️</span><span>设置</span></button>
  </nav>
</div>

<div id="sheet" class="hide">
  <header>
    <button id="sheetClose" class="btn ghost" style="padding:8px 12px">‹ 返回</button>
    <span class="spacer"></span>
    <span class="pill" id="sheetMeta"></span>
  </header>
  <div class="sheet-body" id="sheetBody"></div>
  <div class="composer">
    <div class="chips" id="chips"></div>
    <textarea id="replyBox" placeholder="在这里打字回复…（Ctrl/⌘ + Enter 发送）"></textarea>
    <div class="row">
      <button id="sendBtn" class="btn">发送回复</button>
      <button id="cancelBtn" class="btn danger">取消该请求</button>
      <span class="spacer"></span>
      <span class="hint" id="sheetHint"></span>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const TOKEN_KEY = 'humanApiAdminToken';
  let token = localStorage.getItem(TOKEN_KEY) || '';
  let state = null;
  let currentId = null;
  let tickTimer = null;
  let esAbort = null;

  // ---------------------------------------------------------------- helpers
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function fmtWait(ms) {
    if (ms < 0) ms = 0;
    const s = Math.floor(ms / 1000);
    if (s < 60) return s + ' 秒';
    const m = Math.floor(s / 60);
    if (m < 60) return m + ' 分 ' + (s % 60) + ' 秒';
    return Math.floor(m / 60) + ' 时 ' + (m % 60) + ' 分';
  }
  function fmtClock(ts) {
    const d = new Date(ts);
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  function toast(msg, ms = 2200) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), ms);
  }
  function buzz(pattern) { try { navigator.vibrate && navigator.vibrate(pattern); } catch {} }

  async function api(path, opts = {}) {
    const res = await fetch(path, {
      ...opts,
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json', ...(opts.headers || {}) },
    });
    const text = await res.text();
    let data = {};
    try { data = text ? JSON.parse(text) : {}; } catch { data = { raw: text }; }
    if (!res.ok) throw new Error(data?.error?.message || ('HTTP ' + res.status));
    return data;
  }

  // ---------------------------------------------------------------- auth
  async function login(t) {
    $('gateErr').textContent = '';
    try {
      const res = await fetch('/admin/api/session', { headers: { 'Authorization': 'Bearer ' + t } });
      if (!res.ok) throw new Error('token 不对，或已失效');
      state = await res.json();
      if (!state.ok) throw new Error('token 不对，或已失效');
      token = t;
      localStorage.setItem(TOKEN_KEY, t);
      $('gate').classList.add('hide');
      $('app').classList.remove('hide');
      render();
      connectEvents();
      startTick();
    } catch (err) {
      $('gateErr').textContent = err.message;
    }
  }
  $('loginBtn').onclick = () => login($('tokenInput').value.trim());
  $('tokenInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loginBtn').click(); });

  // ---------------------------------------------------------------- data
  async function refresh() {
    try {
      state = await api('/admin/api/state');
      render();
    } catch (err) {
      console.warn('refresh failed', err);
    }
  }

  function connectEvents() {
    if (esAbort) esAbort.abort();
    esAbort = new AbortController();
    (async () => {
      try {
        const res = await fetch('/admin/api/events', {
          headers: { 'Authorization': 'Bearer ' + token },
          signal: esAbort.signal,
        });
        if (!res.ok || !res.body) throw new Error('SSE ' + res.status);
        $('connDot').classList.add('on');
        const reader = res.body.getReader();
        const dec = new TextDecoder();
        let buf = '';
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          let idx;
          while ((idx = buf.indexOf('\n\n')) >= 0) {
            const chunk = buf.slice(0, idx);
            buf = buf.slice(idx + 2);
            const line = chunk.split('\n').find((l) => l.startsWith('data: '));
            if (!line) continue;
            let evt;
            try { evt = JSON.parse(line.slice(6)); } catch { continue; }
            if (evt.type === 'new') {
              buzz([40, 60, 40]);
              if (window.Notification && Notification.permission === 'granted') {
                try { new Notification('Human API：来了一个新请求'); } catch {}
              }
            }
            await refresh();
          }
        }
        $('connDot').classList.remove('on');
        setTimeout(connectEvents, 3000);
      } catch (err) {
        if (err.name === 'AbortError') return;
        $('connDot').classList.remove('on');
        setTimeout(connectEvents, 3000);
      }
    })();
    if (window.Notification && Notification.permission === 'default') {
      try { Notification.requestPermission(); } catch {}
    }
  }

  function startTick() {
    clearInterval(tickTimer);
    tickTimer = setInterval(() => {
      if (currentId) updateSheetMeta();
      const badge = $('tabBadge');
      if (state && state.stats) {
        const n = state.stats.pending;
        badge.textContent = n;
        badge.classList.toggle('hide', n === 0);
      }
      document.querySelectorAll('[data-wait]').forEach((el) => {
        el.textContent = fmtWait(Date.now() - Number(el.dataset.wait));
      });
    }, 1000);
  }

  // ---------------------------------------------------------------- render
  function render() {
    if (!state) return;
    $('statPill').textContent = `待回复 ${state.stats.pending} · 已回复 ${state.stats.answered}` +
      (state.stats.avgWaitMs ? ` · 均 ${fmtWait(state.stats.avgWaitMs)}` : '');
    const n = state.stats.pending;
    $('tabBadge').textContent = n;
    $('tabBadge').classList.toggle('hide', n === 0);
    renderQueue();
    renderDone();
    renderSettings();
    if (currentId && !state.queue.some((r) => r.id === currentId)) {
      if (!state.done.some((r) => r.id === currentId)) closeSheet();
    } else if (currentId) {
      updateSheetMeta();
    }
  }

  function preview(r) {
    const u = r.transcript.filter((m) => m.role === 'user').pop();
    const t = (u?.content || '(空)').replace(/\s+/g, ' ').trim();
    return t.length > 70 ? t.slice(0, 70) + '…' : t;
  }

  function renderQueue() {
    const el = $('tab-queue');
    if (!state.queue.length) {
      el.innerHTML = '<div class="empty">队列是空的。<br>有请求进来时这里会立刻弹出来，手机也会震一下。</div>';
      return;
    }
    el.innerHTML = state.queue.map((r) => `
      <div class="card ${r.status === 'pending' ? 'pending' : 'expired'}" data-open="${esc(r.id)}">
        <h3>${esc(preview(r))}</h3>
        <div class="meta">
          <span class="tag">${r.status === 'pending' ? '等待中' : '客户端已超时·仍可回复'}</span>
          <span>已等 <b data-wait="${r.created}">${fmtWait(Date.now() - r.created)}</b></span>
          <span class="tag">${esc(r.model)}</span>
          <span class="tag">${esc(r.kind)}</span>
          <span>${r.transcript.length} 条消息</span>
          ${r.meta?.ip ? `<span>${esc(r.meta.ip)}</span>` : ''}
          ${r.notifyError ? `<span style="color:var(--warn)">通知失败</span>` : ''}
        </div>
      </div>`).join('');
  }

  function renderDone() {
    const el = $('tab-done');
    if (!state.done.length) {
      el.innerHTML = '<div class="empty">还没有回复记录。</div>';
      return;
    }
    el.innerHTML = state.done.map((r) => `
      <div class="card">
        <h3>${esc(preview(r))}</h3>
        <div class="meta">
          <span class="tag">${r.status === 'answered' ? '已回复' : '已取消'}</span>
          <span>${fmtClock(r.created)}</span>
          ${r.waitedMs != null ? `<span>用时 ${fmtWait(r.waitedMs)}</span>` : ''}
        </div>
        ${r.answer ? `<div class="answered-text">${esc(r.answer)}</div>` : ''}
      </div>`).join('');
  }

  function renderSettings() {
    const c = state.config;
    const notifyDesc = c.notify.provider === 'ntfy'
      ? `ntfy 主题：<code>${esc(c.notify.topic || '')}</code>`
      : c.notify.provider === 'webhook' ? '自定义 webhook' : '已关闭';
    $('tab-settings').innerHTML = `
      <div class="sec-title">接口地址（填进任何 OpenAI 客户端）</div>
      <div class="card">
        <div class="kv"><span>API base</span><span>${esc(state.publicUrl)}/v1</span></div>
        <div class="kv"><span>模型名</span><span>${c.modelAliases.map(esc).join(' / ')}</span></div>
        <div class="kv"><span>API Key</span><span>${c.apiKeys.map(esc).join('<br>')}</span></div>
        <div class="hint" style="margin-top:10px">完整 key 见服务启动日志或 <code>data/config.json</code>。</div>
      </div>

      <div class="sec-title">手机通知</div>
      <div class="card">
        <div class="kv"><span>通道</span><span>${notifyDesc}</span></div>
        <div class="kv"><span>状态</span><span>${c.notify.enabled ? '开启' : '关闭'}</span></div>
        <div class="row"><button class="btn ghost" id="testNotify">发一条测试通知</button></div>
        <div class="hint" style="margin-top:8px">手机装 ntfy App（App Store / Google Play / F-Droid），订阅上面那个主题即可收到请求提醒。</div>
      </div>

      <div class="sec-title">默认等待时长</div>
      <div class="card">
        <div class="field">
          <label>客户端最长等待（秒）—— 超过就返回超时，但请求仍留在待回复里</label>
          <input id="cfgTimeout" type="number" min="1" max="1800" value="${Math.round(c.timeoutMs / 1000)}">
        </div>
        <div class="field">
          <label>快捷短语（逗号分隔）</label>
          <input id="cfgQuick" value="${esc(c.quickReplies.join('，'))}">
        </div>
        <div class="row"><button class="btn" id="saveCfg">保存</button></div>
      </div>

      <div class="sec-title">其他</div>
      <div class="card">
        <div class="row" style="flex-wrap:wrap;gap:8px">
          <button class="btn ghost" id="rotateApi">重置 API Key</button>
          <button class="btn ghost" id="logout">退出登录</button>
        </div>
      </div>`;

    $('testNotify').onclick = async () => {
      try { const r = await api('/admin/api/test-notify', { method: 'POST' }); toast(r.message || '已发送'); }
      catch (e) { toast('失败：' + e.message); }
    };
    $('saveCfg').onclick = async () => {
      try {
        await api('/admin/api/config', {
          method: 'POST',
          body: JSON.stringify({
            timeoutMs: Number($('cfgTimeout').value) * 1000,
            quickReplies: $('cfgQuick').value.split(/[，,]/).map((s) => s.trim()).filter(Boolean),
          }),
        });
        toast('已保存');
        await refresh();
      } catch (e) { toast('保存失败：' + e.message); }
    };
    $('rotateApi').onclick = async () => {
      if (!confirm('重置 API Key？所有已接入的客户端都要换 key。')) return;
      try { const r = await api('/admin/api/rotate?what=api', { method: 'POST' }); toast('新 key：' + r.apiKeys[0], 6000); await refresh(); }
      catch (e) { toast('失败：' + e.message); }
    };
    $('logout').onclick = () => { localStorage.removeItem(TOKEN_KEY); location.reload(); };
  }

  // ---------------------------------------------------------------- sheet
  function openSheet(id) {
    const r = state.queue.find((x) => x.id === id) || state.done.find((x) => x.id === id);
    if (!r) return;
    currentId = id;
    $('sheet').classList.remove('hide');
    $('sheetBody').innerHTML = r.transcript.map((m) => `
      <div class="msg ${esc(m.role)}">
        <div>
          <div class="role">${esc(m.role)}</div>
          <div class="bubble">${esc(m.content)}</div>
        </div>
      </div>`).join('');
    const done = r.status === 'answered' || r.status === 'cancelled';
    const box = $('replyBox');
    box.value = done ? (r.answer || '') : (box.dataset.forId === id ? box.value : '');
    box.dataset.forId = id;
    box.disabled = done;
    $('sendBtn').disabled = done;
    $('cancelBtn').classList.toggle('hide', done);
    $('chips').innerHTML = state.config.quickReplies.map((q) => `<button data-chip>${esc(q)}</button>`).join('');
    $('chips').querySelectorAll('[data-chip]').forEach((b) => {
      b.onclick = () => {
        const v = box.value.trim();
        box.value = v ? v + '\n' + b.textContent : b.textContent;
        box.focus();
      };
    });
    updateSheetMeta();
    $('sheetBody').scrollTop = 99999;
    if (!done) setTimeout(() => box.focus(), 60);
  }

  function updateSheetMeta() {
    const r = state?.queue.find((x) => x.id === currentId) || state?.done.find((x) => x.id === currentId);
    if (!r) return;
    $('sheetMeta').textContent = r.status === 'pending'
      ? '已等 ' + fmtWait(Date.now() - r.created)
      : (r.status === 'expired' ? '客户端已超时' : '已回复');
    $('sheetHint').textContent = r.meta?.ip ? r.meta.ip : '';
  }

  function closeSheet() {
    currentId = null;
    $('sheet').classList.add('hide');
    $('replyBox').value = '';
  }
  $('sheetClose').onclick = closeSheet;

  $('sendBtn').onclick = async () => {
    const content = $('replyBox').value;
    if (!content.trim() || !currentId) return;
    $('sendBtn').disabled = true;
    try {
      const r = await api('/admin/api/reply', { method: 'POST', body: JSON.stringify({ id: currentId, content }) });
      toast(r.delivered ? '已发送（客户端在线，已收到）' : '已发送（客户端已断线，答案已存档）');
      buzz(30);
      closeSheet();
      await refresh();
    } catch (e) {
      toast('发送失败：' + e.message);
      $('sendBtn').disabled = false;
    }
  };

  $('cancelBtn').onclick = async () => {
    if (!currentId || !confirm('取消这个请求？客户端会收到取消错误。')) return;
    try { await api('/admin/api/cancel', { method: 'POST', body: JSON.stringify({ id: currentId }) }); closeSheet(); await refresh(); }
    catch (e) { toast('取消失败：' + e.message); }
  };

  $('replyBox').addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); $('sendBtn').click(); }
  });

  // ---------------------------------------------------------------- tabs & boot
  document.querySelectorAll('.tabbar button').forEach((btn) => {
    btn.onclick = () => {
      document.querySelectorAll('.tabbar button').forEach((b) => b.classList.remove('sel'));
      btn.classList.add('sel');
      ['queue', 'done', 'settings'].forEach((t) => $('tab-' + t).classList.toggle('hide', t !== btn.dataset.tab));
      if (btn.dataset.tab === 'settings') refresh();
    };
  });

  document.addEventListener('click', (e) => {
    const card = e.target.closest('[data-open]');
    if (card) openSheet(card.dataset.open);
  });

  if (token) {
    login(token);
  } else {
    const m = new URLSearchParams(location.search).get('token');
    if (m) login(m); else $('tokenInput').focus();
  }

  // deep link: /admin?req=<id>
  const wanted = new URLSearchParams(location.search).get('req');
  if (wanted) {
    const tryOpen = setInterval(() => {
      if (state && (state.queue.some((r) => r.id === wanted) || state.done.some((r) => r.id === wanted))) {
        clearInterval(tryOpen);
        openSheet(wanted);
      }
    }, 400);
    setTimeout(() => clearInterval(tryOpen), 15000);
  }

  setInterval(() => { if (token && document.visibilityState === 'visible') refresh(); }, 20000);
  document.addEventListener('visibilitychange', () => { if (token && document.visibilityState === 'visible') refresh(); });
})();
</script>
</body>
</html>
